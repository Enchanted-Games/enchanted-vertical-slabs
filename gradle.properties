\n\
\nNew in v2.6:\
\n\  - Updated to 1.21.6\
\n\  - Fences now connect to vertical slabs just like walls, glass panes, and iron bars do\
\n\  - Backported the mixins from the in progress v3 rewrite for better mod compatability\
\n\  - Added resin bricks translation to tr_tr (thanks Arcdashckr!)\
\n\  - Added ru_ru translations (thanks PlayboyX312!)\
\n\n\
\nNew in v2.6.6:\
\n\  - Update to 26.1\
\n\n\
\nTranslators\
\nHuge thanks to the following people for translating Enchanted Vertical Slabs!\
\n\  - ChristosMaragkos (github) [el_gr]\
\n\  - CANALETA (github) [es_mx]\
\n\  - PlayboyX312 (github) [ru_ru]\
\n\  - Arcdashckr (github) [tr_tr]\
\n\  - VladAndreiMorariu (github) [it_it]\
\n\  - ivan.hd (discord) [pt_br]\
\n\  - unroman (github) [uk_ua]

mod_homepage=https://verticalslabs.enchanted.games/
mod_issues=https://github.com/Enchanted-Games/enchanted-vertical-slabs/issues
