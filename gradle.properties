\n\
\nNew in v2.7:\
\n\  - Update to 26.2\
\n\  - Updated the textures of Vertical Smooth Stone Slabs\
\n\  - Some internal changes, slab ids are now in a different class to where slabs are registered. This is to match how vanilla Minecraft handles blocks and items\
